<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BenAllDoh | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Poppins:wght@500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Poppins', 'sans-serif'] },
                    colors: { twitch: '#9146FF', darkBg: '#0b0f19', darkCard: '#151c2c' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; }
        .glow-text { text-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-sans selection:bg-purple-500 selection:text-white">

    <nav class="fixed w-full z-50 bg-darkBg/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex-shrink-0 cursor-pointer">
                    <h1 class="font-display font-black text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-500">
                        BENALLDOH
                    </h1>
                </a>
                
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8">
                        <a href="index.html" class="text-white border-b-2 border-purple-500 px-3 py-2 text-sm font-semibold uppercase tracking-widest">Home</a>
                        <a href="about.html" class="text-gray-400 hover:text-white px-3 py-2 text-sm font-semibold uppercase tracking-widest transition-colors">About</a>
                        <a href="stats.html" class="text-gray-400 hover:text-white px-3 py-2 text-sm font-semibold uppercase tracking-widest transition-colors">Stats</a>
                        <a href="wets.html" class="text-gray-400 hover:text-white px-3 py-2 text-sm font-semibold uppercase tracking-widest transition-colors">WETS</a>
                        <a href="contact.html" class="text-gray-400 hover:text-white px-3 py-2 text-sm font-semibold uppercase tracking-widest transition-colors">Contact</a>
                    </div>
                </div>

                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-gray-400 hover:text-white focus:outline-none">
                        <i class="fas fa-bars text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-darkCard border-b border-gray-800">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="index.html" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-white bg-purple-900/30">Home</a>
                <a href="about.html" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-800">About</a>
                <a href="stats.html" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-800">Stats</a>
                <a href="wets.html" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-800">WETS</a>
                <a href="contact.html" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-800">Contact</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-24 pb-12 flex flex-col justify-center max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
        <div class="flex flex-col md:flex-row items-center justify-between py-12 md:py-24 gap-12">
            <div class="w-full md:w-1/2 text-center md:text-left space-y-8">
                <div class="inline-block px-4 py-1.5 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-400 text-sm font-semibold tracking-wide mb-2">
                    🔴 LIVE ON TWITCH
                </div>
                <h1 class="font-display font-black text-5xl md:text-7xl leading-tight glow-text text-white">
                    BENALLDOH
                </h1>
                <p class="text-xl md:text-2xl text-gray-400 italic font-light border-l-4 border-blue-500 pl-4 ml-2 md:ml-0">
                    "I think I'm cool but I don't know"
                </p>
                <div class="pt-4 flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
                    <a href="https://twitch.tv/benalldoh" target="_blank" class="inline-flex items-center justify-center px-8 py-4 text-base font-bold text-white transition-all duration-200 bg-twitch hover:bg-purple-600 rounded-lg shadow-lg">
                        <i class="fab fa-twitch mr-2 text-xl"></i> Follow on Twitch
                    </a>
                </div>
            </div>
            
            <div class="w-full md:w-1/2 mt-10 md:mt-0">
                <h3 class="text-2xl font-display font-bold mb-6 text-center md:text-left text-white border-b border-gray-800 pb-2">Latest Content</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="bg-darkCard p-4 rounded-xl border border-gray-800 flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-lg bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center text-xl">🚀</div>
                        <div>
                            <h4 class="font-bold text-gray-200">Geometry Dash</h4>
                            <p class="text-sm text-gray-500">Demon Grinding</p>
                        </div>
                    </div>
                    <a href="wets.html" class="bg-darkCard p-4 rounded-xl border border-gray-800 flex items-center space-x-4 hover:border-purple-500/50 transition-colors group">
                        <div class="w-12 h-12 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-xl">🌊</div>
                        <div>
                            <h4 class="font-bold text-purple-400 group-hover:text-purple-300">WETS Stream Team</h4>
                            <p class="text-sm text-gray-500">Learn about WETS</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-darkBg border-t border-gray-800 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center text-gray-500 text-sm">
            <div class="mb-4 md:mb-0 text-center md:text-left">
                &copy; 2026 BenAllDoh. All rights reserved.
            </div>
            <div class="flex space-x-6 text-lg">
                <a href="https://twitch.tv/benalldoh" target="_blank" class="hover:text-twitch transition-colors"><i class="fab fa-twitch"></i></a>
                <a href="https://youtube.com/@BenAllDoh" target="_blank" class="hover:text-red-500 transition-colors"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
    </footer>
    <script>
        document.getElementById('mobile-menu-btn').addEventListener('click', function() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });
    </script>
</body>
</html>
