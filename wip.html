<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BenAllDoh | Work in Progress</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Poppins', 'sans-serif'] },
                    colors: { twitch: '#9146FF', darkBg: '#0b0f19', darkCard: '#151c2c' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; }
        .glow-text { text-shadow: 0 0 25px rgba(139, 92, 246, 0.5); }
        .pulse-slow { animation: pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.85; transform: scale(0.98); } }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between font-sans selection:bg-purple-500 selection:text-white">

    <!-- Header Logo -->
    <header class="w-full pt-8 text-center">
        <h1 class="font-display font-black text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-500">
            BENALLDOH
        </h1>
    </header>

    <!-- Main Content Box -->
    <main class="max-w-3xl mx-auto px-4 text-center my-auto py-12">
        <div class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-purple-500/10 border border-purple-500/30 text-purple-400 text-xs font-semibold uppercase tracking-widest mb-6 pulse-slow">
            <i class="fas fa-hammer text-purple-400 mr-1"></i>
            <span>Under Construction</span>
        </div>

        <h2 class="font-display font-black text-4xl sm:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-indigo-500 glow-text uppercase mb-6 leading-tight">
            Work In Progress
        </h2>

        <p class="text-gray-400 text-base sm:text-lg max-w-xl mx-auto mb-10 leading-relaxed">
            We're building something awesome! The full site is currently undergoing updates and performance upgrades. Check back soon.
        </p>

        <!-- Social Connections -->
        <div class="flex justify-center space-x-4 mb-8">
            <a href="https://twitch.tv/benalldoh" target="_blank" class="flex items-center space-x-2 px-5 py-3 rounded-xl bg-purple-600/20 border border-purple-500/40 text-purple-300 hover:bg-purple-600 hover:text-white transition-all duration-300 font-semibold text-sm">
                <i class="fab fa-twitch text-lg"></i>
                <span>Watch Live</span>
            </a>
            <a href="stats.html" class="flex items-center space-x-2 px-5 py-3 rounded-xl bg-darkCard border border-gray-800 text-gray-300 hover:border-purple-500 hover:text-white transition-all duration-300 font-semibold text-sm">
                <i class="fas fa-chart-bar text-lg text-purple-400"></i>
                <span>View Live Stats</span>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full pb-8 text-center text-gray-600 text-xs">
        &copy; 2026 BenAllDoh. All rights reserved.
    </footer>

</body>
</html>
