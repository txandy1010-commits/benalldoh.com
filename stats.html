<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BenAllDoh | Stats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Poppins:wght@500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Poppins', 'sans-serif'] },
                    colors: { twitch: '#9146FF', darkBg: '#0b0f19', darkCard: '#151c2c' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; }
        .stat-card {
            background: linear-gradient(145deg, #151c2c, #0d1320);
            box-shadow: 5px 5px 15px #05070c, -5px -5px 15px #111726;
            transition: transform 0.3s ease;
        }
        .stat-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-sans selection:bg-purple-500 selection:text-white">

    <nav class="fixed w-full z-50 bg-darkBg/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex-shrink-0 cursor-pointer">
                    <h1 class="font-display font-black text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-500">
                        BENALLDOH
                    </h1>
                </a>
                
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8">
                        <a href="index.html" class="text-gray-400 hover:text-white px-3 py-2 text-sm font-semibold uppercase tracking-widest transition-colors">Home</a>
                        <a href="about.html" class="text-gray-400 hover:text-white px-3 py-2 text-sm font-semibold uppercase tracking-widest transition-colors">About</a>
                        <a href="stats.html" class="text-white border-b-2 border-purple-500 px-3 py-2 text-sm font-semibold uppercase tracking-widest">Stats</a>
                        <a href="wets.html" class="text-gray-400 hover:text-white px-3 py-2 text-sm font-semibold uppercase tracking-widest transition-colors">Wets</a>
                         <a href="contact.html" class="text-gray-400 hover:text-white px-3 py-2 text-sm font-semibold uppercase tracking-widest transition-colors">Contact</a>
                    </div>
                </div>

                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-gray-400 hover:text-white focus:outline-none">
                        <i class="fas fa-bars text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-darkCard border-b border-gray-800">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="index.html" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-800">Home</a>
                <a href="about.html" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-800">About</a>
                <a href="stats.html" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-white bg-purple-900/30">Stats</a>
                <a href="wets.html" class="text-gray-400 hover:text-white px-3 py-2 text-sm font-semibold uppercase tracking-widest transition-colors">Wets</a>
                <a href="contact.html" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-800">Contact</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
        <div class="text-center mb-16">
            <h2 class="font-display font-black text-4xl text-white">CHANNEL <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">STATS</span></h2>
            <p class="text-gray-400 mt-4 max-w-2xl mx-auto">The Channel Stats!</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="stat-card p-8 rounded-2xl text-center relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 text-purple-500/10 text-8xl"><i class="fas fa-users"></i></div>
                <div class="relative z-10">
                    <div class="text-5xl font-black text-white mb-2 font-display">5.4K</div>
                    <div class="text-purple-400 font-bold uppercase tracking-widest text-sm mb-2">Followers</div>
                </div>
            </div>
            <div class="stat-card p-8 rounded-2xl text-center relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 text-blue-500/10 text-8xl"><i class="fas fa-fire"></i></div>
                <div class="relative z-10">
                    <div class="text-5xl font-black text-white mb-2 font-display">71</div>
                    <div class="text-blue-400 font-bold uppercase tracking-widest text-sm mb-2">Peak Viewers</div>
                </div>
            </div>
            <div class="stat-card p-8 rounded-2xl text-center relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 text-pink-500/10 text-8xl"><i class="fas fa-clock"></i></div>
                <div class="relative z-10">
                    <div class="text-5xl font-black text-white mb-2 font-display">40+</div>
                    <div class="text-pink-400 font-bold uppercase tracking-widest text-sm mb-2">Average Viewers</div>
                </div>
            </div>
            <div class="stat-card p-8 rounded-2xl text-center relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 text-emerald-500/10 text-8xl"><i class="fas fa-calendar-alt"></i></div>
                <div class="relative z-10">
                    <div class="text-4xl font-black text-white mb-2 font-display mt-2">DAILY</div>
                    <div class="text-emerald-400 font-bold uppercase tracking-widest text-sm mb-2">Schedule</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-darkBg border-t border-gray-800 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-gray-500 text-sm">
            &copy; 2026 BenAllDoh. All rights reserved.
        </div>
    </footer>
    <script>
        document.getElementById('mobile-menu-btn').addEventListener('click', function() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });
    </script>
</body>
</html>
